name: CI
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@9bcbea6fa2929fcd1989d50bfbabc49d38dd2f56
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
